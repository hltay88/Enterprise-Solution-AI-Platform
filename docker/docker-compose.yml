# Project Atlas — local development stack (Sprint 1)
# Run from repo root:
#   cp env.example.md .env
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#   ./docker/postgres/check-ready.sh
#   docker compose -f docker/docker-compose.yml --env-file .env down
#
# Re-run DB init scripts (destroys local DB data):
#   docker compose -f docker/docker-compose.yml --env-file .env down -v
#   docker compose -f docker/docker-compose.yml --env-file .env up -d

name: project-atlas

services:
  db:
    # pgvector-enabled Postgres for Sprint 5.2 RAG (Mac-local + SaaS-portable).
    image: pgvector/pgvector:pg16
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc \"SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='users'\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - atlas

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    # Load secrets literally from repo-root .env (avoids Compose $ interpolation
    # mangling OpenAI keys that contain dollar signs).
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://atlas:atlas@db:5432/atlas}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-local-dev}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-changeme}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Atlas Demo}
      # Gemini keys are safe to interpolate (no $). Also loaded via env_file above.
      # Pass explicitly so `docker compose --env-file .env` always injects them.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # OPENAI_API_KEY stays env_file-only to avoid Compose $ mangling.
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ATLAS_AI_PROVIDER: ${ATLAS_AI_PROVIDER:-auto}
      ATLAS_EMBEDDING_PROVIDER: ${ATLAS_EMBEDDING_PROVIDER:-auto}
      ATLAS_EMBEDDING_DIMS: ${ATLAS_EMBEDDING_DIMS:-384}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_BATCH_UPLOAD_MB: ${MAX_BATCH_UPLOAD_MB:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      KNOWLEDGE_PATH: ${KNOWLEDGE_PATH:-/app/knowledge}
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/app/storage
      - ../knowledge:/app/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atlas

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: atlas-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - atlas

volumes:
  postgres-data:
    name: atlas-postgres-data

networks:
  atlas:
    name: atlas-network
    driver: bridge
